name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. Pull the codebase cleanly
    - uses: actions/checkout@v4

    # 2. Boot Up Java JDK required by the internal Android SDK compiler
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Setup Flutter Environment (Updated to match your exact Flet framework version requirements)
    - name: Set up Flutter Toolchain
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.44.8'

    # 4. Provision the Python Runtime 
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 5. Fetch the Project Pipeline Packages
    - name: Install Dependencies
      run: |
        pip install flet gspread google-auth

    # 6. Inject the secure secret into the build assets tree dynamically
    - name: Hydrate Service Account Key
      run: |
        mkdir -p assets
        echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > assets/service_account.json

    # 7. Execute compilation (Added --no-interactive flag to prevent automated prompt freezes)
    - name: Run Flet Build Engine
      run: |
        flet build apk --no-interactive

    # 8. Deliver the Finalized Installation Package
    - name: Upload Finalized APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TempleTracker-Android-APK
        path: build/apk/*.apk
