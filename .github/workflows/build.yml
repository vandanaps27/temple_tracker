name: Build Android APK

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 3. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 4. Install latest Flet
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade flet

      # 5. Google Service Account
      - name: Hydrate Service Account Key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p assets

          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "ERROR: SERVICE_ACCOUNT_JSON GitHub secret is empty."
            exit 1
          fi

          printf '%s' "$SERVICE_ACCOUNT_JSON" > assets/service_account.json

          test -s assets/service_account.json

          echo "Service account file created."

      # 6. Verify environment
      - name: Verify Build Environment
        run: |
          echo "Python:"
          python --version

          echo "Flet:"
          flet --version

          echo "Java:"
          java -version

      # 7. Clean previous Flet build
      - name: Clean Flet Build
        run: |
          flet clean

      # 8. Build APK
      - name: Build Android APK
        run: |
          flet build apk --yes --verbose

      # 9. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TempleTracker-Android-APK
          path: build/apk/*.apk
          if-no-files-found: error
