name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. Pull the codebase cleanly
    - uses: actions/checkout@v4

    # 2. Boot Up Java JDK required by the internal Android builder
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Provision the Python Runtime 
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 4. Fetch the Project Pipeline Packages
    - name: Install Dependencies
      run: |
        pip install flet gspread google-auth

    # 5. Inject the secure secret into the build assets tree dynamically
    - name: Hydrate Service Account Key
      run: |
        mkdir -p assets
        echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > assets/service_account.json

    # 6. Execute compilation using the Official Flet Action Bundle
    - name: Run Flet Build Engine
      uses: flet-dev/flet-build-action@v1
      with:
        target: apk
        build-number: ${{ github.run_number }}

    # 7. Deliver the Finalized Installation Package
    - name: Upload Finalized APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TempleTracker-Android-APK
        path: build/apk/*.apk
