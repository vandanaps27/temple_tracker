name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. Pull the codebase cleanly
    - uses: actions/checkout@v4

    # 2. Boot Up Java JDK required by the internal Android SDK compiler
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Setup Flutter Environment
    - name: Set up Flutter Toolchain
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.44.8'

    # 4. Provision the Python Runtime 
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
       # 5. Package Fetching + Global Dependency Engineering
    - name: Configure App Dependencies
      run: |
        pip install flet
        echo "flet" > requirements.txt
        echo "gspread" >> requirements.txt
        echo "google-auth" >> requirements.txt
        echo "charset-normalizer" >> requirements.txt
        
        PYTHON_LIB_DIR=$(python -c "import sysconfig; print(sysconfig.get_path('stdlib'))")
        cp -r "$PYTHON_LIB_DIR/wsgiref" ./wsgiref

        pip install --target ./patch_env gspread google-auth charset-normalizer
        
        TARGET_LOG_FILE="./patch_env/google/oauth2/_client_log_status.py"
        if [ -f "$TARGET_LOG_FILE" ]; then
          sed -i 's/sys.stdout.reconfigure(encoding="utf-8")/pass/g' "$TARGET_LOG_FILE"
          sed -i 's/sys.stderr.reconfigure(encoding="utf-8")/pass/g' "$TARGET_LOG_FILE"
        fi

        cp -r ./patch_env/* ./
        rm -rf ./patch_env


    # 6. Inject the secure secret into the assets tree dynamically
    - name: Hydrate Service Account Key
      run: |
        mkdir -p assets
        echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > assets/service_account.json

        # 7. Execute compilation using Flet's bundling engine with forced dependency overrides
    - name: Run Flet Build Engine
      run: |
        FLUTTER_BIN_DIR=$(dirname $(which flutter))
        export FLUTTER_ROOT=$(dirname "$FLUTTER_BIN_DIR")
        echo "Resolved Flutter Root at: $FLUTTER_ROOT"
        
        # 7a. Hard-code a custom override specification file
        echo "dependency_overrides:" > custom_pubspec.yaml
        echo "  jni: ^1.1.0" >> custom_pubspec.yaml
        echo "  jni_flutter: ^1.0.4" >> custom_pubspec.yaml
        
        # 7b. Run compilation utilizing the pubspec override file to force clean versions
        flet build apk --pub-spec-override custom_pubspec.yaml


    # 8. Deliver the Finalized Installation Package
    - name: Upload Finalized APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TempleTracker-Android-APK
        path: build/apk/*.apk
