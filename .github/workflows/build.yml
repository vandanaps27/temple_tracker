name: Build Android APK

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17 required by Android/Flet
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 3. Setup Flutter version required by Flet 0.86.5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.8"
          cache: true

      # 4. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 5. Install the exact Flet version used by the application
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.86.5"

      # 6. Application dependencies
      - name: Create Requirements File
        run: |
          cat > requirements.txt <<'EOF'
          flet==0.86.5
          gspread
          google-auth
          EOF

      # 7. Inject Google Service Account credential
      - name: Hydrate Service Account Key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p assets

          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "ERROR: SERVICE_ACCOUNT_JSON GitHub secret is empty."
            exit 1
          fi

          printf '%s' "$SERVICE_ACCOUNT_JSON" > assets/service_account.json

          echo "Service account file created."
          test -s assets/service_account.json

      # 8. Verify build environment
      - name: Verify Build Environment
        run: |
          echo "Python:"
          python --version

          echo "Flet:"
          flet --version

          echo "Flutter:"
          flutter --version

          echo "Java:"
          java -version

      # 9. Build APK
      - name: Build Android APK
        run: |
          flet build apk --yes

      # 10. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TempleTracker-Android-APK
          path: build/apk/*.apk
          if-no-files-found: error
